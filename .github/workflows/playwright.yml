name: Playwright Tests
on: #event triggers for the workflow when code is pushed to the repository or when a pull request is opened against the main or master branch
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs: #a set of steps that will be executed as part of the workflow, in this case we have a single job called "test" that will run our Playwright tests
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
